[project]
name = "meridian"
version = "0.1.0"
description = "Named Entity Recognition API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.7.0",
    "fastapi[standard]>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
