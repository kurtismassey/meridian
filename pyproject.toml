[project]
name = "meridian"
version = "0.1.0"
description = "UK location NER library (local authority, region, postcode)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "fastapi[standard]>=0.100.0",
    "rich>=13.0.0",
]
server = [
    "fastapi[standard]>=0.100.0",
    "rich>=13.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["meridian", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["spacy.*", "pandas.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
